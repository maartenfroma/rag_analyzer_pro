version: "3.9"

services:

  rag-analyzer-pro:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-analyzer-pro

    ports:
      - "8502:8501"

    env_file:
      - .env

    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./chroma_db:/app/chroma_db

    depends_on:
      - postgres

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: rag-postgres

    environment:
      POSTGRES_DB: rag_analyzer_pro
      POSTGRES_USER: rag_admin
      POSTGRES_PASSWORD: maart123

    ports:
      - "5433:5432"
      

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: